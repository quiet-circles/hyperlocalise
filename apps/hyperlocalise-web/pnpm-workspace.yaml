allowBuilds:
  '@mongodb-js/zstd': false
  '@nestjs/core': false
  '@swc/core': false
  bun: true
  cbor-extract: false
  esbuild: false
  msw: false
  node-liblzma: false
  protobufjs: false
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.19'
  - '@ai-sdk/gateway@4.0.28'
  - '@ai-sdk/openai@4.0.20'
  - '@ai-sdk/react@4.0.40'
  - ai@7.0.37
overrides:
  vite: "8.2.2"
  # Pin each undici major independently (transitive deps use 6/7/8).
  "undici@^6.0.0": "6.28.0"
  "undici@^7.0.0": "7.29.0"
  "undici@^8.0.0": "8.10.1"
  devalue: "5.9.2"
  qs: "6.16.0"
  "@anthropic-ai/sdk": "0.123.0"
  postcss: "8.5.26"
  postcss-selector-parser: "7.1.5"
  esbuild: "0.28.2"
  "ip-address": "10.7.0"
  hono: "4.13.5"
  "@hono/node-server": "2.1.1"
  form-data: "4.0.6"
  "axios@^1.0.0": "1.20.0"
  fast-uri: "3.1.7"
  "@xmldom/xmldom": "0.9.12"
  browserslist: "4.28.8"
  linkify-it: "5.0.2"
  # exceljs uses CommonJS require('uuid'); keep v11 only on that path.
  "@zwight/exceljs>uuid": "11.1.1"
  "mermaid>uuid": "14.0.2"
  dompurify: "3.4.14"
  "js-yaml@^3.0.0": "3.15.2"
  "js-yaml@^4.0.0": "4.3.2"
  "nanoid@^3.0.0": "6.0.1"
  "nanoid@^5.0.0": "6.0.1"
  "brace-expansion@^2.0.0": "2.1.4"
  "brace-expansion@^5.0.0": "5.0.9"
  mermaid: "11.17.2"
  valibot: "1.4.2"
  # TipTap 3.28 pulls prosemirror-model ^1.25.9 while nested PM packages
  # still resolve 1.25.8; dual copies break editor Fragment identity.
  prosemirror-model: "1.25.11"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
